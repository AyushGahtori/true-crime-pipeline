[project]
name = "true-crime-pipeline"
version = "0.0.0"
description = "Workspace root for the hybrid true-crime documentary pipeline."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/shared_contracts",
  "packages/db",
  "packages/agent1_scout",
  "packages/agent2_evidence",
  "packages/agent3_gatekeeper",
  "packages/voice_sync",
  "packages/agent4_director",
  "packages/orchestrator",
  "packages/python_motion",
  "packages/crime_scene_2k",
  "packages/flow_adapter",
  "packages/agent6_mastering",
  "packages/analytics_feedback",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-p zero_spend_guard --import-mode=importlib"
pythonpath = ["scripts"]
testpaths = ["scripts", "packages", "apps"]
norecursedirs = ["node_modules", ".venv", "dist", "artifacts", "ready_to_upload"]
