[project]
name = "shared-contracts"
version = "4.0.0"
description = "Frozen v4 shared contracts (Pydantic v2) for the true-crime pipeline."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
